name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly keep-alive ping so the free Supabase project doesn't pause from
  # idleness. TURNED OFF while the project is deliberately paused — put the two
  # lines back to resume it:
  #
  #   schedule:
  #     - cron: '17 6 * * 1'
  #
  # The keepalive job below is deliberately loud: it exits 1 and raises
  # `::error::Supabase did not answer 200`, because a project that had paused
  # quietly would have taken the whole evening down. Now that the pause is the
  # intended state, that alarm is a false one — it would fail every Monday and
  # mail a red workflow about a thing that is working as asked. A false alarm
  # left running is how a real one gets ignored.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # This has never worked. `/rest/v1/` answers 401 to an anon key (with or
      # without an Authorization header), and `curl -f` turns that into exit 22
      # — so the weekly job has failed every run since it was written and the
      # free project has had no keep-alive at all. A paused project on the night
      # would take the whole evening down.
      #
      # /auth/v1/health is the endpoint that actually answers 200 unauthenticated,
      # and it reaches the project rather than a CDN edge.
      - name: Ping Supabase so the free project stays awake
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ vars.VITE_SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}")
          echo "auth/v1/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer 200 — the project may be paused"
            exit 1
          fi
          echo "supabase awake"
